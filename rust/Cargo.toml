[workspace]
resolver = "2"
members = ["sangfor-core", "sangfor-tun", "sangfor-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/TsinbeiLabs/flutter_sangfor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
hmac = { version = "0.12", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }

[profile.release]
# The core ships inside an iOS packet tunnel extension with a ~50 MB budget and
# into a Windows service binary; size matters more than peak throughput.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
