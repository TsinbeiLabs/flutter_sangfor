name: flutter_sangfor_easy_connect
description: Easy Connect connector for the flutter_sangfor package family.
version: 0.0.2
repository: https://github.com/TsinbeiLabs/flutter_sangfor

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0
  pointycastle: ^4.0.0
  flutter_sangfor: ^0.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0

# The PEM files under test/fixtures are self-signed certificates generated
# with openssl for the in-process TLS tests; they are not real secrets.
false_secrets:
  - test/fixtures/test-cert.pem
  - test/fixtures/test-key.pem
