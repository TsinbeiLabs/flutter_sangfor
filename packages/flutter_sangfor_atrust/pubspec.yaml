version: 0.0.1
repository: https://github.com/TsinbeiLabs/flutter_sangfor

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0
  pointycastle: ^3.9.1
  flutter_sangfor: ^0.0.1

dependency_overrides:
  flutter_sangfor:
    path: ../..

dev_dependencies:
  test: ^1.25.0
