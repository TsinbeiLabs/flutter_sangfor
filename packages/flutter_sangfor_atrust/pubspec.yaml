name: flutter_sangfor_atrust
description: aTrust connector for the flutter_sangfor package family.
version: 0.0.10
repository: https://github.com/TsinbeiLabs/flutter_sangfor

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0
  pointycastle: ^4.0.0
  flutter_sangfor:
    git:
      url: https://github.com/TsinbeiLabs/flutter_sangfor.git
      ref: codex/ios-xcode27
      path: packages/flutter_sangfor

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0
