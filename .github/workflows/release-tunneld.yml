name: Release sangfor-tunneld

# Publishes the tunnel daemon so consuming apps can fetch a pinned artifact
# instead of requiring a Rust toolchain on every contributor's machine and every
# build agent. Same shape as the `key_obfuscator` prebuilts the app already
# fetches: one asset per target, sha256 recorded in a lock file.
#
# Deliberately tag- or dispatch-triggered, never on push. A release is a
# publishing action, and building one per commit would produce artifacts nobody
# can reference stably.

on:
  push:
    tags:
      - 'tunneld-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish under (created if absent)'
        required: true
        default: 'tunneld-v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the platform with the elevation problem the daemon
          # solves, so it is the one that has to work first.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: sangfor-tunneld-windows-x64.exe
            features: sangfor-tun/wintun
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            asset: sangfor-tunneld-windows-arm64.exe
            features: sangfor-tun/wintun
          # Linux has no elevation problem to solve, but the same binary runs
          # there and a daemon is still how the tunnel outlives the app.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: sangfor-tunneld-linux-x64
            features: sangfor-tun/tun
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: sangfor-tunneld-linux-arm64
            features: sangfor-tun/tun
    defaults:
      run:
        working-directory: rust
    env:
      # Nothing in the dependency graph needs a C compiler -- crypto is
      # RustCrypto, TLS is rustls on the RustCrypto provider, the event loop is
      # `mio` -- so the *only* thing a foreign target needs is a linker and the
      # C runtime it links against. This is the variable cargo reads for the
      # linker.
      #
      # It is also why the `rust-core` CI job cross-compiles libraries and not
      # this binary: `cargo build` of an rlib never links, so it needs no
      # toolchain, and a binary does.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install the cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          # Two packages, and both are needed. `gcc-aarch64-linux-gnu` is the
          # linker driver; `libc6-dev-arm64-cross` is the target's C runtime,
          # which is where `Scrt1.o` and `crti.o` come from. Installing only the
          # compiler gets as far as the link and then fails with
          # "cannot find Scrt1.o", which does not name the missing package.
          sudo apt-get install --no-install-recommends -y \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version | head -1

      # The workspace release profile is already size-tuned (opt-level="z", lto,
      # codegen-units=1, panic="abort", strip), so there is nothing to pass here.
      - name: Build
        run: >-
          cargo build --release --target ${{ matrix.target }}
          -p sangfor-tunneld --features ${{ matrix.features }}

      # The workspace release profile is already size-tuned (opt-level="z", lto,
      # codegen-units=1, panic="abort", strip), so there is nothing to pass here.
      - name: Build
        run: >-
          cargo build --release --target ${{ matrix.target }}
          -p sangfor-tunneld --features ${{ matrix.features }}

      - name: Stage the artifact
        shell: bash
        run: |
          mkdir -p ../dist
          binary="sangfor-tunneld"
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary="sangfor-tunneld.exe"; fi
          cp "target/${{ matrix.target }}/release/$binary" "../dist/${{ matrix.asset }}"

      # Cheap and worth it: a binary that links is not a binary that runs, and
      # `panic = "abort"` with a stripped symbol table makes a startup failure
      # very hard to diagnose from the far side. Only the two targets whose ABI
      # matches the runner can be executed; the arm64 pair is checked by the
      # linker having succeeded at all.
      - name: Smoke-test the artifact
        shell: bash
        run: |
          target="${{ matrix.target }}"
          binary="../dist/${{ matrix.asset }}"
          case "$target" in
            x86_64-pc-windows-msvc|x86_64-unknown-linux-gnu) ;;
            *) echo "cross-built for $target; cannot execute on this runner"; exit 0 ;;
          esac
          chmod +x "$binary" 2>/dev/null || true
          "$binary" --help > /dev/null
          "$binary" --print-install > /dev/null 2>&1 || \
            echo "  (--print-install is Windows-only, as expected on $target)"
          echo "$binary runs"

      - name: Record the checksum
        shell: bash
        run: |
          cd ../dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the lock fragment
        # This is what goes into a consuming app's prebuilts.lock.json. Printed
        # into the job log and committed as an asset so the update is a copy
        # rather than a transcription.
        run: |
          {
            echo '['
            first=1
            for checksum in dist/*.sha256; do
              asset=$(basename "$checksum" .sha256)
              digest=$(awk '{print $1}' "$checksum")
              if [ "$first" -eq 0 ]; then echo ','; fi
              first=0
              printf '  {\n    "asset": "%s",\n    "sha256": "%s"\n  }' "$asset" "$digest"
            done
            echo ''
            echo ']'
          } > dist/prebuilts.fragment.json
          cat dist/prebuilts.fragment.json

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: sangfor-tunneld ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/sangfor-tunneld-*
            dist/prebuilts.fragment.json
          body: |
            The tunnel daemon: `sangfor-host` plus a platform packet device, in
            one binary. Run `sangfor-tunneld --help` for the flags, and see
            `rust/sangfor-tunneld/VERIFY.md` for how to check a build against a
            real gateway.

            **Windows needs `wintun.dll` beside the executable.** It is not
            bundled, because the only license-compliant distribution is the
            signed DLL from https://www.wintun.net/. The consuming app's build
            already stages it for the Flutter runner; the daemon needs the same
            copy. `prebuilts.fragment.json` has the checksums for a lock file.

            **Installing on Windows.** Creating a wintun adapter needs an
            elevated process, so an app that runs `asInvoker` cannot do it at
            all. Run `sangfor-tunneld --install` once from an elevated shell: it
            writes `%LOCALAPPDATA%\sangfor-tunneld\host.json` with a generated
            control token and registers a logon task with `/RL HIGHEST`, so the
            daemon starts elevated at every logon with no prompt and an ordinary
            app can drive it over `127.0.0.1:7166`. `--print-install` shows the
            commands without running them.

            It is a logon task and not a service on purpose: a service runs as
            LocalSystem in session 0, where the control socket can neither
            identify its peer nor hold a per-user token. The trade is that the
            tunnel does not outlive logoff. `docs/rust-core.md` §6.2 has the
            argument.

            **Control protocol.** One JSON object per line, on stdin and on the
            loopback socket: `ping`, `status`, `start` (with `planPath` and an
            optional `configPath`), `stopSession`, and `stop`. The process
            outlives its sessions — `--plan` means "run this one first", not
            "run this one and exit" — so one daemon serves repeated
            connect/disconnect cycles. A session plan is named by path and never
            sent inline, because it carries the request signing key.
