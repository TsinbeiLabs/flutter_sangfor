name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    name: analyze and test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - flutter_sangfor
          - flutter_sangfor_atrust
          - flutter_sangfor_easy_connect
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Point connectors at the local root package
        # Lockstep releases reference a root version that is not on pub.dev
        # yet; dependency_overrides bypasses version resolution so tests run
        # against the monorepo checkout.
        if: matrix.package != 'flutter_sangfor'
        run: |
          printf '\ndependency_overrides:\n  flutter_sangfor:\n    path: ../flutter_sangfor\n' >> pubspec.yaml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  rust-core:
    name: rust data plane (core, tls, tun, host, ffi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all -- --check
      # The device features are on so the Linux and handed-over-descriptor code
      # is linted and tested, not just compiled for a foreign target.
      - name: Lint
        run: >-
          cargo clippy --workspace --all-targets
          --features sangfor-tun/tun,sangfor-tun/fd -- -D warnings
      # The golden tests decode the fixtures the Dart reference implementation
      # generates, so a protocol change on either side fails here rather than
      # in production. `sangfor-host` runs the whole loop against a fake
      # gateway that replays those same fixtures.
      - name: Test
        run: >-
          cargo test --workspace
          --features sangfor-tun/tun,sangfor-tun/fd
      # No C toolchain anywhere in the dependency graph: crypto is RustCrypto
      # and TLS is rustls on the RustCrypto provider, so OHOS and Android stay
      # a plain `cargo build`. `ring` or `aws-lc-rs` would break this.
      - name: Cross-compile (no C toolchain required)
        run: |
          rustup target add aarch64-linux-android aarch64-unknown-linux-ohos x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl \
            -p sangfor-core -p sangfor-tls -p sangfor-host -p sangfor-tun
          cargo build --release --target aarch64-linux-android \
            -p sangfor-core -p sangfor-tls -p sangfor-host -p sangfor-tun --features sangfor-tun/fd
          cargo build --release --target aarch64-unknown-linux-ohos \
            -p sangfor-core -p sangfor-tls -p sangfor-host -p sangfor-tun --features sangfor-tun/fd
      # The wintun device is Windows-only, so it is compiled here rather than
      # tested: creating an adapter needs elevation and the signed driver.
      - name: Cross-compile the Windows device
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc \
            -p sangfor-tun --features sangfor-tun/wintun

  swift-core:
    name: native swift core (packet tunnel data plane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter_sangfor
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      # The pure-Swift half of the packet tunnel extension has to reproduce the
      # Dart implementation's canonical JSON, HMAC signatures, and protocol
      # frames byte for byte. The golden fixtures are checked in (and kept
      # honest by the atrust package's fixture test), so this job only needs a
      # Swift toolchain.
      - name: Compile and run the native core checks
        run: bash tool/run_swift_tests.sh

  windows:
    name: build windows example
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows example
        run: flutter build windows --debug
        working-directory: packages/flutter_sangfor/example

  publish:
    name: publish (flutter_sangfor)
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    needs: [packages, windows, swift-core, rust-core]
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter_sangfor

  await-root-on-pub:
    # Lockstep releases: the connectors resolve flutter_sangfor from pub.dev,
    # so wait until the freshly published root version is actually visible
    # there before starting their publish jobs. Runs even when the root
    # publish job itself failed (e.g. the version was already published by an
    # earlier partial run) as long as pub.dev serves the expected version.
    name: await flutter_sangfor on pub.dev
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Poll pub.dev for the root package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version:' packages/flutter_sangfor/pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '"'"'"'[:space:]')
          echo "Waiting for flutter_sangfor $version on pub.dev..."
          for i in $(seq 1 60); do
            if curl -fsS https://pub.dev/api/packages/flutter_sangfor \
              | jq -e --arg v "$version" '[.versions[].version] | index($v) != null' > /dev/null; then
              echo "flutter_sangfor $version is live on pub.dev"
              exit 0
            fi
            sleep 10
          done
          echo "::error::flutter_sangfor $version did not appear on pub.dev within 10 minutes"
          exit 1

  publish-connectors:
    name: publish (${{ matrix.package }})
    if: >-
      always() && !cancelled() &&
      needs.await-root-on-pub.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch')
    needs: await-root-on-pub
    strategy:
      fail-fast: false
      matrix:
        package:
          - flutter_sangfor_atrust
          - flutter_sangfor_easy_connect
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/${{ matrix.package }}
