name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    name: analyze and test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - flutter_sangfor
          - flutter_sangfor_atrust
          - flutter_sangfor_easy_connect
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Point connectors at the local root package
        # Lockstep releases reference a root version that is not on pub.dev
        # yet; dependency_overrides bypasses version resolution so tests run
        # against the monorepo checkout.
        if: matrix.package != 'flutter_sangfor'
        run: |
          printf '\ndependency_overrides:\n  flutter_sangfor:\n    path: ../flutter_sangfor\n' >> pubspec.yaml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  windows:
    name: build windows example
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows example
        run: flutter build windows --debug
        working-directory: packages/flutter_sangfor/example

  publish:
    name: publish (${{ matrix.package }})
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    needs: [packages, windows]
    strategy:
      fail-fast: false
      matrix:
        package:
          - flutter_sangfor
          - flutter_sangfor_atrust
          - flutter_sangfor_easy_connect
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/${{ matrix.package }}
