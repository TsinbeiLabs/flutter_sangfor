name: CI

on:
  push:
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: |
          (cd packages/flutter_sangfor && flutter pub get)
          (cd packages/flutter_sangfor_atrust && flutter pub get)
          (cd packages/flutter_sangfor_easy_connect && flutter pub get)
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/flutter_sangfor/lib packages/flutter_sangfor/test
          packages/flutter_sangfor_atrust packages/flutter_sangfor_easy_connect
      - name: Analyze root package
        working-directory: packages/flutter_sangfor
        run: flutter analyze
      - name: Test root package
        working-directory: packages/flutter_sangfor
        run: flutter test
      - name: Analyze aTrust package
        working-directory: packages/flutter_sangfor_atrust
        run: flutter analyze
      - name: Test aTrust package
        working-directory: packages/flutter_sangfor_atrust
        run: flutter test
      - name: Analyze Easy Connect package
        working-directory: packages/flutter_sangfor_easy_connect
        run: flutter analyze
      - name: Test Easy Connect package
        working-directory: packages/flutter_sangfor_easy_connect
        run: flutter test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Windows example
        run: flutter build windows --debug
        working-directory: packages/flutter_sangfor/example
        env:
          # GitHub runners ship CMake 4.x which rejects the old googletest
          # pinned by the Flutter windows runner template.
          CMAKE_POLICY_VERSION_MINIMUM: 3.5
